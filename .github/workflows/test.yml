name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Install dig on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Check module checksums
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Static analysis
        run: make check
      - name: Race and integration tests
        run: make test
      - name: Fuzz question parser
        run: go test ./internal/dnsserver -run='^$' -fuzz=FuzzQuestion -fuzztime=10s -parallel=2
      - name: Fuzz TXT encoding
        run: go test ./internal/dnsserver -run='^$' -fuzz=FuzzTXTWire -fuzztime=10s -parallel=2
      - name: Verify release packaging
        if: runner.os == 'Linux'
        run: make release VERSION=v0.0.0-ci
