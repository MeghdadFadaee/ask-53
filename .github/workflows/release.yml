name: build release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed, such as v0.1.0 or v0.1.0-rc.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Build archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ask53-release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 14
