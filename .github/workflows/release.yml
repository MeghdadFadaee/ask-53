name: build release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed, such as v0.1.0 or v0.1.0-rc.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Build archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ask53-release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 14
